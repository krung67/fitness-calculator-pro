<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Favicon de Calculadora Fit.

    Solo las iniciales: a 16 px, que es como se ve en una pestaña, el texto
    "CALCULADORA FIT" del logo grande es una mancha ilegible. Las letras van
    generosas y con poco margen porque el navegador lo reduce mucho.

    Los colores son los de la web: fondo #07090b y lima #c8f135.
  -->
  <rect width="64" height="64" rx="14" fill="#07090b"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#2d3d08" stroke-width="2"/>
  <text x="32" y="33" fill="#c8f135"
        font-family="Helvetica, Arial, sans-serif" font-size="29" font-weight="700"
        text-anchor="middle" dominant-baseline="central" letter-spacing="0">CF</text>
</svg>
